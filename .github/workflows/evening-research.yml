name: Evening Research (NSE)

on:
  schedule:
    - cron: "30 12 * * 1-5"
    - cron: "30 4 * * 6,0"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening research
        run: python researcher.py

      - name: Commit report
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "Evening research $(date +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Send email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_reporter.py researcher
