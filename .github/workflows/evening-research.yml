name: Evening Research

on:
  schedule:
    # 6:00 PM EST = 11:00 PM UTC | Mon-Fri
    - cron: "0 23 * * 1-5"
    # Weekend deep dive: Saturday & Sunday at 10am EST = 3pm UTC
    - cron: "0 15 * * 6,0"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening research
        run: python researcher.py

      - name: Commit report
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Evening research $(date +%Y-%m-%d)"
          git push
