name: Morning Momentum Scan (NSE)

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC | Mon-Fri
    - cron: "30 2 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run morning scan
        run: python scanner.py

      - name: Commit report
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/
          git diff --cached --quiet || (git commit -m "Morning scan $(date +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Send email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_reporter.py scanner
