name: Performance Audit (6:30pm IST)

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run performance audit
        run: python audit.py

      - name: Commit audit report and journal
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/ trade_journal.json 2>/dev/null || git add reports/
          git diff --cached --quiet || (git commit -m "Audit $(date +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Send email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_reporter.py audit
