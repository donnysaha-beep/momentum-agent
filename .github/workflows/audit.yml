name: Performance Audit (6:30pm IST)

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

concurrency:
  group: performance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run performance audit
        run: python audit.py

      - name: Commit audit report and journal
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/ trade_journal.json 2>/dev/null || git add reports/
          git diff --cached --quiet || (git commit -m "Audit $(date +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Send email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_reporter.py audit

      - name: Alert on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'EOF'
          import smtplib, os
          from email.mime.text import MIMEText
          user = os.environ.get("GMAIL_USER","")
          pwd  = os.environ.get("GMAIL_APP_PASSWORD","")
          if not user or not pwd: exit()
          msg = MIMEText("Performance Audit FAILED. Check GitHub Actions: https://github.com/donnysaha-beep/momentum-agent/actions")
          msg["Subject"] = "[ALERT] Performance Audit failed — check now"
          msg["From"] = user
          msg["To"] = "donny.saha@gmail.com"
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pwd)
              s.sendmail(user, "donny.saha@gmail.com", msg.as_string())
          print("Failure alert sent.")
          EOF
