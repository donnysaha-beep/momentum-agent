name: Intraday Pulse Check (hourly)

on:
  schedule:
    # Every hour from 10am to 3pm IST (4:30am to 9:30am UTC) Mon-Fri
    - cron: "30 4 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run intraday pulse
        run: python intraday_pulse.py

      - name: Commit pulse log
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/ market_pulse.json
          git diff --cached --quiet || git commit -m "Pulse check $(date +%H:%M)"
          git push
