name: Layer 0 Market Intelligence (7:30am IST)

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: layer0-intelligence
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Layer 0 intelligence
        run: python layer0_intelligence.py

      - name: Commit report and layer0.json
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/ layer0.json
          git diff --cached --quiet || (git commit -m "Layer 0 intelligence $(date +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Send email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python email_reporter.py layer0

      - name: Alert on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'EOF'
          import smtplib, os
          from email.mime.text import MIMEText
          user = os.environ.get("GMAIL_USER","")
          pwd  = os.environ.get("GMAIL_APP_PASSWORD","")
          if not user or not pwd: exit()
          msg = MIMEText("Layer 0 Market Intelligence FAILED. Check GitHub Actions: https://github.com/donnysaha-beep/momentum-agent/actions")
          msg["Subject"] = "[ALERT] Layer 0 failed — check now"
          msg["From"] = user
          msg["To"] = "donny.saha@gmail.com"
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pwd)
              s.sendmail(user, "donny.saha@gmail.com", msg.as_string())
          print("Failure alert sent.")
          EOF
