name: Layer 0 Market Intelligence (7:30am IST)

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Layer 0 intelligence
        run: python layer0_intelligence.py

      - name: Commit report and layer0.json
        run: |
          git config user.name "momentum-bot"
          git config user.email "bot@github.com"
          git add reports/ layer0.json
          git diff --cached --quiet || (git commit -m "Layer 0 intelligence $(date +%Y-%m-%d)" && git pull --rebase && git push)
