name: Auth Watchdog (8:15am IST)

on:
  schedule:
    # 8:15am IST = 2:45am UTC | Mon-Fri
    - cron: "45 2 * * 1-5"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run auth watchdog
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python auth_watchdog.py
